<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="hallwayWall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="tiledFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Hallway Entry Wall -->
  <rect x="0" y="0" width="1000" height="700" fill="url(#hallwayWall)"/>

  <!-- Light Switch on wall -->
  <rect x="180" y="240" width="80" height="120" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <rect x="210" y="280" width="20" height="36" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>

  <!-- Timber Skirting Board / Baseboard -->
  <rect x="0" y="660" width="1000" height="75" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <line x1="0" y1="675" x2="1000" y2="675" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Hallway Entry Floor -->
  <rect x="0" y="735" width="1000" height="265" fill="url(#tiledFloor)"/>
  <!-- Tile Grout Lines -->
  <line x1="200" y1="735" x2="100" y2="1000" stroke="#0f172a" stroke-width="3"/>
  <line x1="500" y1="735" x2="450" y2="1000" stroke="#0f172a" stroke-width="3"/>
  <line x1="800" y1="735" x2="820" y2="1000" stroke="#0f172a" stroke-width="3"/>
  <line x1="0" y1="840" x2="1000" y2="840" stroke="#0f172a" stroke-width="2.5"/>

  <!-- DEFECT ZONE: Pre-existing friction scuffs on entry plasterboard -->
  <!-- Target normalized box: [520, 290, 710, 580] -> Y: 520-710, X: 290-580 -->
  <g id="pre-existing-hallway-scuff">
    <path d="M 310 590 Q 360 570 420 600 T 520 580" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M 340 620 Q 390 610 470 635" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 300 645 Q 380 655 540 640" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" opacity="0.65"/>
    <!-- Rubber bumper scuff marks -->
    <ellipse cx="450" cy="610" rx="35" ry="12" fill="#475569" opacity="0.4" transform="rotate(-5 450 610)"/>
    <ellipse cx="380" cy="635" rx="25" ry="8" fill="#334155" opacity="0.45"/>
  </g>

  <!-- Condition Report Agency Ruler Stamp -->
  <g transform="translate(680, 500)">
    <rect x="0" y="0" width="260" height="90" rx="8" fill="#0f172a" opacity="0.85"/>
    <text x="15" y="30" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">ENTRY INSPECTION 2022</text>
    <text x="15" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="12">Hallway Skirting Item #14</text>
    <text x="15" y="74" fill="#fbbf24" font-family="sans-serif" font-size="12">Noted: "Minor entry scuffs present"</text>
  </g>

  <!-- Timestamp badge -->
  <rect x="25" y="25" width="410" height="42" rx="8" fill="#000000" fill-opacity="0.65"/>
  <text x="40" y="52" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold">● MOVE-IN CONDITION REPORT</text>
  <rect x="715" y="25" width="260" height="42" rx="8" fill="#000000" fill-opacity="0.65"/>
  <text x="730" y="52" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="bold">15 FEB 2022 • 10:15</text>
</svg>
